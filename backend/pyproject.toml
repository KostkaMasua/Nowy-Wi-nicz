[project]
name = "wisnicz-api"
version = "0.1.0"
description = "API HTTP z danymi mapy mieszkańców Wiśnicza (tylko biblioteka standardowa)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
wisnicz-api = "wisnicz_api.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wisnicz_api"]
